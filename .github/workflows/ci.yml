# Fork CI: Windows desktop only. Keep upstream source, docs, and skills untouched.
name: Windows CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    # Preserve the stable check name used by existing PR status rules.
    name: all checks passed
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      CI: 'true'
      DSH_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Enable Windows symlink support
        shell: pwsh
        run: >-
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock"
          /t REG_DWORD /f /v "AllowDevelopmentWithoutDevLicense" /d "1"

      - uses: pnpm/action-setup@v5.0.0

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: pnpm

      - name: Install locked dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Test Skill Launcher and DSH UI integration
        shell: pwsh
        run: >-
          pnpm exec vitest run
          packages/client/ui-matt-skill-launcher/tests/actions.client.spec.ts
          packages/client/ui-renderer/tests/scoped-slots.client.spec.tsx

      - name: Build Windows workspace (Host, Client, Desktop, Web)
        shell: pwsh
        run: pnpm run build
