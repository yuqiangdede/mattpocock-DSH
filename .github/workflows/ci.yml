# Windows-only checks for this fork. Upstream docs/skills stay unchanged.
name: Windows CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: all checks passed
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      CI: 'true'
      DSH_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Enable Windows symlink support
        shell: pwsh
        run: >-
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock"
          /t REG_DWORD /f /v "AllowDevelopmentWithoutDevLicense" /d "1"

      - uses: pnpm/action-setup@v5.0.0

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: pnpm

      - name: Install locked dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile

      # PR #1 adds the Launcher; master does not contain it yet.
      - name: Detect Skill Launcher tests
        id: launcher
        shell: pwsh
        run: |
          $exists = Test-Path "packages/client/ui-matt-skill-launcher/tests/actions.client.spec.ts"
          "exists=$($exists.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Test Skill Launcher and DSH UI integration
        if: steps.launcher.outputs.exists == 'true'
        shell: pwsh
        run: >-
          pnpm exec vitest run
          packages/client/ui-matt-skill-launcher/tests/actions.client.spec.ts
          packages/client/ui-renderer/tests/scoped-slots.client.spec.tsx

      - name: Build Windows workspace (Host, Client, Desktop, Web)
        shell: pwsh
        run: pnpm run build

      - name: Test offline Desktop bundled plugin defaults and Computer Use preset
        shell: pwsh
        run: pnpm exec vitest run apps/desktop/tests/project-manager.spec.ts apps/desktop/tests/bundled-desktop-operator.spec.ts

      # Packaging reads apps/desktop/.env.windows even for unsigned builds.
      # Use an isolated loopback-only test configuration; never put release
      # credentials, signing keys, or live update URLs in fork CI.
      - name: Set up unsigned Windows packaging configuration
        shell: pwsh
        run: |
          @'
          DSH_DESKTOP_APP_ID=com.mattpocock.dsh.ci
          DSH_DESKTOP_AUTO_UPDATE_ENV=test
          DOWNLOAD_TEST_ORIGIN=https://127.0.0.1
          DOWNLOAD_TEST_COS_BUCKET=offline-ci-no-upload
          DOWNLOAD_TEST_RELEASE_ID=0123456789abcdef0123456789abcdef
          DSH_DESKTOP_MANDATORY_UPDATE_TEST_ORIGIN=https://127.0.0.1
          DSH_DESKTOP_MANDATORY_UPDATE_CONFIG='{"allowedAuthOrigins":["https://127.0.0.1"]}'
          '@ | Set-Content -Path apps/desktop/.env.windows -Encoding utf8

      # This is a shipping requirement, not a documentation gate: reject installers
      # whose bundled Computer Use release or native runtime fails verification.
      - name: Build and smoke-test offline Windows installer
        shell: pwsh
        run: pnpm run package:desktop:win:x64:unsigned
